name: ci

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: "${{ github.base_ref }}"
        run: |
          git fetch -q origin "$BASE"
          python3 scripts/check_commit_messages.py "FETCH_HEAD..HEAD"
      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.12.9/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q -n auto
      - name: build and check the wheel
        run: |
          uv build --out-dir dist
          python3 scripts/check_wheel.py dist/*.whl
